<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
  <title id="title">ST7789 drawing protocol flow</title>
  <desc id="desc">Flowchart showing the ST7789 drawing sequence: set column address, set page address, write RAM command, then stream RGB565 pixels with DC high.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1c5b84"/>
    </marker>
    <style>
      .cmd { fill: #eef6fb; stroke: #1c5b84; stroke-width: 3; rx: 14; }
      .data { fill: #edf7ed; stroke: #2e7d32; stroke-width: 3; rx: 14; }
      .pixel { fill: #fff1f1; stroke: #c62828; stroke-width: 3; rx: 14; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 26px; fill: #18384f; }
      .small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 22px; fill: #18384f; }
      .arrow { stroke: #1c5b84; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="cmd" x="210" y="30" width="500" height="78"/>
  <text class="label" x="460" y="62" text-anchor="middle">Command 0x2A</text>
  <text class="small" x="460" y="94" text-anchor="middle">set column window: x0..x1</text>

  <path class="arrow" d="M460 112 V154"/>
  <rect class="data" x="210" y="158" width="500" height="78"/>
  <text class="label" x="460" y="190" text-anchor="middle">Data parameters</text>
  <text class="small" x="460" y="222" text-anchor="middle">x0 MSB/LSB, x1 MSB/LSB</text>

  <path class="arrow" d="M460 240 V282"/>
  <rect class="cmd" x="210" y="286" width="500" height="78"/>
  <text class="label" x="460" y="318" text-anchor="middle">Command 0x2B</text>
  <text class="small" x="460" y="350" text-anchor="middle">set page window: y0..y1</text>

  <path class="arrow" d="M460 368 V410"/>
  <rect class="cmd" x="210" y="414" width="500" height="78"/>
  <text class="label" x="460" y="446" text-anchor="middle">Command 0x2C</text>
  <text class="small" x="460" y="478" text-anchor="middle">write RAM / accept pixels</text>

  <path class="arrow" d="M460 496 V538"/>
  <rect class="pixel" x="150" y="542" width="620" height="78"/>
  <text class="label" x="460" y="574" text-anchor="middle">Stream RGB565 pixels</text>
  <text class="small" x="460" y="606" text-anchor="middle">DC = HIGH until selected window is filled</text>
</svg>
