<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">HD44780 I2C backpack driver flow</title>
  <desc id="desc">Flowchart showing print string, print one character, send byte, send upper nibble through PCF8574, send lower nibble through PCF8574, and delay.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1c5b84"/>
    </marker>
    <style>
      .box { fill: #eef6fb; stroke: #1c5b84; stroke-width: 3; rx: 14; }
      .green { fill: #edf7ed; stroke: #2e7d32; }
      .red { fill: #fff1f1; stroke: #c62828; }
      .gray { fill: #f5f5f5; stroke: #555; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 28px; fill: #18384f; }
      .small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; fill: #18384f; }
      .arrow { stroke: #1c5b84; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="300" y="24" width="380" height="62"/>
  <text class="label" x="490" y="64" text-anchor="middle">print string</text>

  <path class="arrow" d="M490 90 V130"/>
  <rect class="box" x="300" y="134" width="380" height="62"/>
  <text class="label" x="490" y="174" text-anchor="middle">print one character</text>

  <path class="arrow" d="M490 200 V240"/>
  <rect class="box" x="270" y="244" width="440" height="62"/>
  <text class="label" x="490" y="284" text-anchor="middle">send byte</text>

  <path class="arrow" d="M490 310 V350"/>
  <rect class="box green" x="105" y="354" width="340" height="78"/>
  <text class="small" x="275" y="386" text-anchor="middle">send upper nibble</text>
  <text class="small" x="275" y="416" text-anchor="middle">I2C -> PCF8574</text>

  <path class="arrow" d="M445 393 H535"/>
  <rect class="box red" x="540" y="354" width="300" height="78"/>
  <text class="small" x="690" y="386" text-anchor="middle">I2C writes</text>
  <text class="small" x="690" y="416" text-anchor="middle">E=1 then E=0</text>

  <path class="arrow" d="M690 436 V476"/>
  <rect class="box green" x="105" y="480" width="340" height="78"/>
  <text class="small" x="275" y="512" text-anchor="middle">send lower nibble</text>
  <text class="small" x="275" y="542" text-anchor="middle">I2C -> PCF8574</text>

  <path class="arrow" d="M445 519 H535"/>
  <rect class="box red" x="540" y="480" width="300" height="78"/>
  <text class="small" x="690" y="512" text-anchor="middle">I2C writes</text>
  <text class="small" x="690" y="542" text-anchor="middle">E=1 then E=0</text>

  <path class="arrow" d="M690 562 V620 H490 V640"/>
  <rect class="box gray" x="220" y="644" width="540" height="58"/>
  <text class="small" x="490" y="681" text-anchor="middle">wait for LCD execution time</text>
</svg>
